name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare yarn@1.22.22 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - run: yarn install --frozen-lockfile
      - name: Build static site
        run: yarn build
        env:
          # Same prerender path as before; base is the domain root.
          GITHUB_PAGES: "true"
          PAGES_BASE: /
      - name: Page for unknown paths
        run: sed "s#%BASE%#/#g" static/404.html > dist/client/404.html
      # One curl transfer per file: hoster.by drops long FTP data sockets from Actions.
      - name: Upload to hoster.by
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        working-directory: dist/client
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f | sed 's|^\./||' | sort)
          echo "Uploading ${#files[@]} files to ${FTP_SERVER}"
          for rel in "${files[@]}"; do
            echo "→ ${rel}"
            for attempt in 1 2 3 4 5; do
              if curl --silent --show-error --fail \
                --connect-timeout 30 \
                --retry 2 \
                --retry-delay 2 \
                --ftp-pasv \
                --ftp-create-dirs \
                -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
                -T "${rel}" \
                "ftp://${FTP_SERVER}/${rel}"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to upload ${rel} after ${attempt} attempts" >&2
                exit 1
              fi
              echo "retry ${attempt} for ${rel}"
              sleep $((attempt * 2))
            done
          done
          echo "Upload finished"
