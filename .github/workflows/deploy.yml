name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare yarn@1.22.22 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - run: yarn install --frozen-lockfile
      - name: Build static site
        run: yarn build
        env:
          # Same prerender path as before; base is the domain root.
          GITHUB_PAGES: "true"
          PAGES_BASE: /
      - name: Page for unknown paths
        run: sed "s#%BASE%#/#g" static/404.html > dist/client/404.html
      # Shared hoster.by FTP often drops the SamKirkland data socket from Actions.
      # lftp + passive mode + retries is more reliable for this host.
      - name: Upload to hoster.by
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Empty password after the comma → lftp reads LFTP_PASSWORD (handles special chars).
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -c "
            set cmd:fail-exit true
            set ftp:passive-mode true
            set ftp:ssl-allow no
            set net:max-retries 8
            set net:reconnect-interval-base 5
            set net:reconnect-interval-multiplier 1
            set net:timeout 30
            set mirror:parallel-transfer-count 1
            open -u ${FTP_USERNAME}, ftp://${FTP_SERVER}
            mirror -R --verbose --only-newer --no-perms --exclude-glob .ftp-deploy-sync-state.json dist/client/ ./
            bye
          "